<!-- Gene - Nov, 08, 2026: Minimalist Geometric 'B' + Checkmark standalone vector mark (transparent background) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024" fill="none">
  <defs>
    <linearGradient id="haloGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="bGrad" x1="20" y1="16" x2="70" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="42" y1="74" x2="84" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Subtle Squircle Halo -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#haloGrad)" />

  <!-- Geometric 'B' Backbone, Upper Loop & Lower Loop -->
  <!-- Gene - Nov, 08, 2026: Complete Geometric 'B' (upper & lower bowls) with negative-space knockout Checkmark (✓) -->
  <path
    d="M 24 49 L 24 28 Q 24 22 30 22 L 46 22 A 13.5 13.5 0 0 1 46 49 L 24 49 L 24 70 Q 24 76 30 76 L 48 76 A 13.5 13.5 0 0 0 48 49"
    stroke="url(#bGrad)"
    stroke-width="10.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Negative-Space Knockout Halo for Checkmark -->
  <path
    d="M 46 61 L 57 72 L 80 44"
    stroke="#E3ECF6"
    stroke-width="17.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Integrated Confirmation Checkmark (✓) -->
  <path
    d="M 46 61 L 57 72 L 80 44"
    stroke="url(#checkGrad)"
    stroke-width="10.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Minimalist Calendar-Pin Accent Dot -->
  <circle cx="76" cy="22" r="5.5" fill="#0284C7" />
</svg>
