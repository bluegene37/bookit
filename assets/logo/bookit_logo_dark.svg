<!-- Gene - Nov, 08, 2026: Minimalist Geometric 'B' + Checkmark BookIt Logo (Dark Neumorphic Edition) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024" fill="none">
  <defs>
    <linearGradient id="darkSurface" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222834" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>
    <linearGradient id="haloGradDark" x1="18" y1="18" x2="82" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="bGradDark" x1="24" y1="20" x2="68" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="checkGradDark" x1="44" y1="72" x2="80" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Dark Neumorphic Badge Background -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#darkSurface)" stroke="#2E3646" stroke-width="1.5" />

  <!-- Subtle Inner Squircle Halo -->
  <rect x="14" y="14" width="72" height="72" rx="20" fill="url(#haloGradDark)" />

  <!-- Geometric 'B' Backbone, Upper Loop & Lower Loop -->
  <!-- Gene - Nov, 08, 2026: Complete Geometric 'B' (upper & lower bowls) with negative-space knockout Checkmark (✓) -->
  <path
    d="M 24 49 L 24 28 Q 24 22 30 22 L 46 22 A 13.5 13.5 0 0 1 46 49 L 24 49 L 24 70 Q 24 76 30 76 L 48 76 A 13.5 13.5 0 0 0 48 49"
    stroke="url(#bGradDark)"
    stroke-width="10.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Negative-Space Knockout Halo for Checkmark -->
  <path
    d="M 46 61 L 57 72 L 80 44"
    stroke="#1A202C"
    stroke-width="17.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Integrated Confirmation Checkmark (✓) -->
  <path
    d="M 46 61 L 57 72 L 80 44"
    stroke="url(#checkGradDark)"
    stroke-width="10.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Minimalist Calendar-Pin Accent Dot -->
  <circle cx="74" cy="24" r="5" fill="#38BDF8" />
</svg>
